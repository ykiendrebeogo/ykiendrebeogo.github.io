name: Generate PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/pdf/**'
      - 'README.md'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Install Dependencies
        run: |
          npm ci
          bundle install

      - name: Build Site
        run: bundle exec jekyll build

      - name: Generate PDF
        run: npm run pdf

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if the PDF has changed
          if [[ -n $(git status --porcelain assets/pdf/cv_jaewon.pdf) ]]; then
            git add assets/pdf/cv_jaewon.pdf
            git commit -m "Update CV PDF [skip ci]"
            git push
          else
            echo "No changes to the PDF. Skipping commit."
          fi
