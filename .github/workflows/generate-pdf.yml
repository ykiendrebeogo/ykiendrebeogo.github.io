name: Generate PDF

on:
  workflow_dispatch:  # Manual trigger only — CV PDF is now maintained manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            ca-certificates fonts-liberation libx11-6 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxtst6 libnss3 libglib2.0-0 \
            libasound2t64 libxrandr2 libpangocairo-1.0-0 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libnspr4 libpango-1.0-0 lsb-release wget xdg-utils

      - name: Install Dependencies
        run: |
          pip3 install --upgrade nbconvert
          npm ci
          bundle install

      - name: Build Site
        run: bundle exec jekyll build

      - name: Generate PDF
        run: npm run pdf

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if the PDF has changed
          if [[ -n $(git status --porcelain assets/pdf/cv.pdf) ]]; then
            git add assets/pdf/cv.pdf
            git commit -m "Update CV PDF [skip ci]"
            git push
          else
            echo "No changes to the PDF. Skipping commit."
          fi
